background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.65
}

input-field {
    monitor =
    size = 300, 55
    position = 0, -80
    halign = center
    valign = center

    inner_color = rgba(7, 19, 33, 0.90)
    outer_color = rgba(20, 42, 66, 0.95)
    outline_thickness = 2

    font_color = rgba(230, 240, 250, 1.0)
    placeholder_text = <i>Enter password...</i>
    fail_text = <i>Authentication failed</i>

    rounding = 12
    fade_on_empty = false
    hide_input = false

    check_color = rgba(0, 255, 153, 1.0)
    fail_color = rgba(255, 80, 80, 1.0)

    capslock_color = rgba(255, 200, 80, 1.0)
    numlock_color = rgba(255, 200, 80, 1.0)

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(230, 240, 250, 1.0)
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = rgba(150, 175, 200, 1.0)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(200, 220, 235, 1.0)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -20
    halign = center
    valign = center
}
